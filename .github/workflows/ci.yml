name: CI

on:
  push:
  workflow_dispatch:

# El token del workflow solo lee el repo (subir el artefacto no necesita más).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # WPF y Windows.Media.Ocr necesitan Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - run: dotnet restore BoCoach.slnx
      - run: dotnet build BoCoach.slnx -c Release --no-restore
      - run: dotnet test BoCoach.slnx -c Release --no-build --logger trx --results-directory test-results

      # Sin iniciar sesión en GitHub no se ven los logs, pero las anotaciones sí (también por la API pública:
      # check-runs/<job>/annotations): cada test que falla queda como una, con su mensaje.
      - name: Tests fallidos como anotaciones
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem test-results -Filter *.trx -Recurse | ForEach-Object {
            [xml]$trx = Get-Content $_.FullName -Raw
            $trx.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' } | ForEach-Object {
              $text = "$($_.testName): $($_.Output.ErrorInfo.Message) $($_.Output.ErrorInfo.StackTrace)"
              if ($text.Length -gt 1500) { $text = $text.Substring(0, 1500) }
              $text = $text.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
              Write-Output "::error::$text"
            }
          }

      # La versión portable (BoCoach.exe con .NET adentro + data), para bajarla y probarla en otra PC.
      - run: dotnet publish src/BoCoach.App -c Release -r win-x64 -o publish/BoCoach
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BoCoach-portable-win-x64
          path: publish/
          retention-days: 14

  web:
    # La web: tests de la base (PGlite), el Core en WebAssembly corrido en Node, lint, tipos y build de Next.
    runs-on: ubuntu-24.04 # ubuntu-latest pasa a Ubuntu 26 desde el 2026-10-19: se cambia a mano, probando antes
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
