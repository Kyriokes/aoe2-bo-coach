name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # WPF y Windows.Media.Ocr necesitan Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - run: dotnet restore BoCoach.slnx
      - run: dotnet build BoCoach.slnx -c Release --no-restore
      - run: dotnet test BoCoach.slnx -c Release --no-build
