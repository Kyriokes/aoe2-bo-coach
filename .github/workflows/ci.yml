name: CI

on:
  push:
  workflow_dispatch:

# El token del workflow solo lee el repo (subir el artefacto no necesita más).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # WPF y Windows.Media.Ocr necesitan Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - run: dotnet restore BoCoach.slnx
      - run: dotnet build BoCoach.slnx -c Release --no-restore
      # --blame-crash: si un proceso de test se cae, el trx dice cuál y en qué test estaba.
      - run: dotnet test BoCoach.slnx -c Release --no-build --logger trx --results-directory test-results --blame-crash --blame-hang-timeout 10m

      # Sin iniciar sesión en GitHub no se ven los logs, pero las anotaciones sí (también por la API pública:
      # check-runs/<job>/annotations): cada test que falla queda como una, con su mensaje.
      - name: Tests fallidos como anotaciones
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Note($text) {
            if ($text.Length -gt 1500) { $text = $text.Substring(0, 1500) }
            Write-Output ("::error::" + $text.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A'))
          }
          $files = @(Get-ChildItem test-results -Filter *.trx -Recurse -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { Note "No quedó ningún .trx en test-results." }
          foreach ($file in $files) {
            try {
              [xml]$trx = Get-Content $file.FullName -Raw
              # Lo que no es de un test (un proceso que se cayó, un error al cargar un ensamblado).
              foreach ($info in @($trx.TestRun.ResultSummary.RunInfos.RunInfo)) {
                if ($info -and $info.Text) { Note "$($file.Name): $($info.Outcome) $($info.Text)" }
              }
              foreach ($result in @($trx.TestRun.Results.UnitTestResult)) {
                if ($result -and $result.outcome -ne 'Passed') {
                  Note "$($result.testName) ($($result.outcome)): $($result.Output.ErrorInfo.Message) $($result.Output.ErrorInfo.StackTrace)"
                }
              }
            } catch {
              Note "$($file.Name): no se pudo leer ($($_.Exception.Message))"
            }
          }
          exit 0

      # La versión portable (BoCoach.exe con .NET adentro + data), para bajarla y probarla en otra PC.
      - run: dotnet publish src/BoCoach.App -c Release -r win-x64 -o publish/BoCoach
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BoCoach-portable-win-x64
          path: publish/
          retention-days: 14

  web:
    # La web: tests de la base (PGlite), el Core en WebAssembly corrido en Node, lint, tipos y build de Next.
    runs-on: ubuntu-24.04 # ubuntu-latest pasa a Ubuntu 26 desde el 2026-10-19: se cambia a mano, probando antes
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  stats:
    # La herramienta offline de las estadísticas de cruces: solo los tests con datos inventados (no baja nada).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/stats
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/stats/requirements.txt

      - run: pip install -r requirements.txt
      - run: python -m pytest -q
