name: Release

# Al subir una etiqueta v* (por ejemplo v0.9.0) arma la versión portable y la publica como release de GitHub.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - run: dotnet test BoCoach.slnx -c Release

      - name: Versión portable
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          dotnet publish src/BoCoach.App -c Release -r win-x64 -p:Version=$version -o publish/BoCoach
          Compress-Archive -Path publish/BoCoach -DestinationPath "BoCoach-$env:GITHUB_REF_NAME-win-x64.zip"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "BoCoach-${{ github.ref_name }}-win-x64.zip" --title "BO Coach ${{ github.ref_name }}" --generate-notes
